<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>동영상 - NEXO KOREA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트: Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- 아이콘: Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 공통 컴포넌트 로드 스크립트 -->
    <script src="components/components.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nexo: {
                            navy: '#0f172a',
                            dark: '#020617',
                            cyan: '#06b6d4',
                            accent: '#22d3ee',
                            orange: '#f97316',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
        
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-nexo-navy text-white font-sans overflow-x-hidden">

    <!-- Header Placeholder (동적으로 로드됨) -->
    <div id="header-placeholder"></div>

    <!-- Page Content -->
    <section class="pt-32 pb-24 min-h-screen bg-slate-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="text-center mb-16">
                <h2 class="text-nexo-cyan font-bold tracking-widest text-sm mb-2">VIDEO GALLERY</h2>
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-black mb-6 text-white">
                    제품 데모 영상
                </h1>
                <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                    NEXO 스마트 디스플레이의 다양한 기능과 활용 사례를 영상으로 확인하세요.
                </p>
            </div>

            <!-- Video Gallery Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700">
                    <div class="relative w-full" style="padding-bottom: 177.78%;">
                        <iframe 
                            class="absolute top-0 left-0 w-full h-full" 
                            src="https://www.youtube.com/embed/DycCGxWEzeM" 
                            title="NEXO 제품 데모 영상 1" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
                <div class="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700">
                    <div class="relative w-full" style="padding-bottom: 177.78%;">
                        <iframe 
                            class="absolute top-0 left-0 w-full h-full" 
                            src="https://www.youtube.com/embed/FsphbXxgkak" 
                            title="NEXO 제품 데모 영상 2" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
                <div class="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700">
                    <div class="relative w-full" style="padding-bottom: 177.78%;">
                        <iframe 
                            class="absolute top-0 left-0 w-full h-full" 
                            src="https://www.youtube.com/embed/nKYE16PydzQ" 
                            title="NEXO 제품 데모 영상 3" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
                <div class="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700">
                    <div class="relative w-full" style="padding-bottom: 177.78%;">
                        <iframe 
                            class="absolute top-0 left-0 w-full h-full" 
                            src="https://www.youtube.com/embed/Ofl5GWPY2lQ" 
                            title="NEXO 제품 데모 영상 4" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <h4 class="text-xl sm:text-2xl font-bold text-center mb-8 sm:mb-12 text-white">
                원하시는 정보를 선택하세요
            </h4>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 sm:gap-6">
                <!-- 홈 카드 -->
                <a href="index.html" class="group relative bg-slate-800/50 backdrop-blur border border-slate-700 rounded-2xl p-6 sm:p-8 hover:border-nexo-cyan hover:scale-105 hover:shadow-2xl transition-all duration-300 flex flex-col items-center text-center">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 bg-nexo-cyan/20 rounded-full flex items-center justify-center mb-4 group-hover:bg-nexo-cyan/30 transition-colors">
                        <i data-lucide="home" class="w-7 h-7 sm:w-8 sm:h-8 text-nexo-cyan"></i>
                    </div>
                    <h5 class="text-lg sm:text-xl font-bold text-white mb-2 group-hover:text-nexo-cyan transition-colors">
                        홈
                    </h5>
                    <p class="text-xs sm:text-sm text-slate-400">
                        메인 페이지로 이동
                    </p>
                </a>

                <!-- 제품소개 카드 -->
                <a href="product.html" class="group relative bg-slate-800/50 backdrop-blur border border-slate-700 rounded-2xl p-6 sm:p-8 hover:border-nexo-cyan hover:scale-105 hover:shadow-2xl transition-all duration-300 flex flex-col items-center text-center">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 bg-nexo-cyan/20 rounded-full flex items-center justify-center mb-4 group-hover:bg-nexo-cyan/30 transition-colors">
                        <i data-lucide="package" class="w-7 h-7 sm:w-8 sm:h-8 text-nexo-cyan"></i>
                    </div>
                    <h5 class="text-lg sm:text-xl font-bold text-white mb-2 group-hover:text-nexo-cyan transition-colors">
                        제품소개
                    </h5>
                    <p class="text-xs sm:text-sm text-slate-400">
                        제품 사양과 기능 확인
                    </p>
                </a>

                <!-- 동영상 카드 -->
                <a href="video.html" class="group relative bg-slate-800/50 backdrop-blur border border-slate-700 rounded-2xl p-6 sm:p-8 hover:border-nexo-cyan hover:scale-105 hover:shadow-2xl transition-all duration-300 flex flex-col items-center text-center">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 bg-nexo-cyan/20 rounded-full flex items-center justify-center mb-4 group-hover:bg-nexo-cyan/30 transition-colors">
                        <i data-lucide="play-circle" class="w-7 h-7 sm:w-8 sm:h-8 text-nexo-cyan"></i>
                    </div>
                    <h5 class="text-lg sm:text-xl font-bold text-white mb-2 group-hover:text-nexo-cyan transition-colors">
                        동영상
                    </h5>
                    <p class="text-xs sm:text-sm text-slate-400">
                        제품 소개 영상 시청
                    </p>
                </a>

                <!-- 기술자료 카드 -->
                <a href="resources.html" class="group relative bg-slate-800/50 backdrop-blur border border-slate-700 rounded-2xl p-6 sm:p-8 hover:border-nexo-cyan hover:scale-105 hover:shadow-2xl transition-all duration-300 flex flex-col items-center text-center">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 bg-nexo-cyan/20 rounded-full flex items-center justify-center mb-4 group-hover:bg-nexo-cyan/30 transition-colors">
                        <i data-lucide="file-text" class="w-7 h-7 sm:w-8 sm:h-8 text-nexo-cyan"></i>
                    </div>
                    <h5 class="text-lg sm:text-xl font-bold text-white mb-2 group-hover:text-nexo-cyan transition-colors">
                        기술자료
                    </h5>
                    <p class="text-xs sm:text-sm text-slate-400">
                        기술 자료 다운로드
                    </p>
                </a>

                <!-- 사용매뉴얼 카드 -->
                <a href="manual.html" class="group relative bg-slate-800/50 backdrop-blur border border-slate-700 rounded-2xl p-6 sm:p-8 hover:border-nexo-cyan hover:scale-105 hover:shadow-2xl transition-all duration-300 flex flex-col items-center text-center">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 bg-nexo-cyan/20 rounded-full flex items-center justify-center mb-4 group-hover:bg-nexo-cyan/30 transition-colors">
                        <i data-lucide="book-open" class="w-7 h-7 sm:w-8 sm:h-8 text-nexo-cyan"></i>
                    </div>
                    <h5 class="text-lg sm:text-xl font-bold text-white mb-2 group-hover:text-nexo-cyan transition-colors">
                        사용매뉴얼
                    </h5>
                    <p class="text-xs sm:text-sm text-slate-400">
                        사용 매뉴얼 다운로드
                    </p>
                </a>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder (동적으로 로드됨) -->
    <div id="footer-placeholder"></div>

    <script>
        // Initialize Lucide Icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
