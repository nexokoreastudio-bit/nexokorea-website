<body class="bg-nexo-navy text-white font-sans overflow-x-hidden">

    <section class="py-10 sm:py-14 bg-slate-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="text-center mb-8">
                <h2 class="text-nexo-cyan font-bold tracking-widest text-sm mb-2">VIDEO MANUAL</h2>
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-black mb-4 text-white">
                    동영상 매뉴얼
                </h1>
                <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                    전자칠판의 외관, 기능, 응용 방법을 영상으로 확인하세요.
                </p>
            </div>

            <!-- 카테고리별 동영상 (Supabase 동적 로딩, 모든 카테고리 자동 감지) -->
            <div id="videoSections"></div>
            <script>
                (async function loadAllVideos() {
                    const SUPABASE_URL = 'https://qwyeanxbtkzompzxndhk.supabase.co';
                    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3eWVhbnhidGt6b21wenhuZGhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NTE5ODcsImV4cCI6MjA4NzEyNzk4N30.qj1dUEokDkvWN_Ukw1nkDqj_aSNwpgTZv7Qti9R5hro';
                    const container = document.getElementById('videoSections');
                    const iconMap = { '제품소개': 'play-circle', '사용법': 'book-open', '설치영상': 'wrench', '외관': 'monitor', '기능': 'settings', '응용': 'lightbulb', '기타': 'video' };
                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/nexo_videos?is_published=eq.true&order=sort_order.asc,created_at.desc`, {
                            headers: { 'apikey': SUPABASE_KEY }
                        });
                        const videos = await res.json();
                        if (!videos || videos.length === 0) {
                            container.innerHTML = '<p class="text-slate-500 text-center py-8">등록된 동영상이 없습니다.</p>';
                            return;
                        }
                        const grouped = {};
                        videos.forEach(v => {
                            const cat = v.category || '기타';
                            if (!grouped[cat]) grouped[cat] = [];
                            grouped[cat].push(v);
                        });
                        const catOrder = ['제품소개', '사용법', '설치영상', '외관', '기능', '응용', '기타'];
                        const sortedEntries = Object.entries(grouped).sort((a, b) => {
                            const ia = catOrder.indexOf(a[0]), ib = catOrder.indexOf(b[0]);
                            return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                        });
                        container.innerHTML = sortedEntries.map(([cat, vids], idx) => {
                            const icon = iconMap[cat] || 'video';
                            const grid = vids.map(v => {
                                const m = (v.youtube_url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([^?&]+)/);
                                const embedId = m ? m[1] : '';
                                return `<div class="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 hover:border-nexo-cyan/50 transition-all duration-300">
                                    <div class="relative w-full" style="padding-bottom: 56.25%;">
                                        <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${embedId}" title="${v.title||''}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
                                    </div>
                                    <div class="p-4">
                                        <h4 class="text-sm font-bold text-white">${v.title||''}</h4>
                                        ${v.description ? `<p class="text-xs text-slate-400 mt-1 line-clamp-2">${v.description}</p>` : ''}
                                    </div>
                                </div>`;
                            }).join('');
                            return `<div class="mb-10 pt-8 ${idx > 0 ? 'border-t border-slate-700' : ''}">
                                <h3 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
                                    <i data-lucide="${icon}" class="w-6 h-6 text-nexo-cyan"></i>
                                    ${cat}
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">${grid}</div>
                            </div>`;
                        }).join('');
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    } catch (e) {
                        container.innerHTML = '<p class="text-red-400 text-center py-8">동영상 로딩 실패</p>';
                    }
                })();
            </script>
        </div>
