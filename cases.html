<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Tailwind CSS -->

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

    <!-- 폰트: Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- 아이콘: Lucide Icons -->

    <!-- 공통 컴포넌트 로드 스크립트 -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nexo: {
                            navy: '#0f172a',
                            dark: '#020617',
                            cyan: '#06b6d4',
                            accent: '#22d3ee',
                            orange: '#f97316',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .case-card:hover .case-overlay {
            opacity: 1;
        }

        .case-detail-panel {
            width: min(100vw - 24px, 1100px);
            max-height: calc(100vh - 32px);
        }

        .case-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .case-gallery-item {
            position: relative;
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.75);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .case-gallery-item:hover {
            transform: scale(1.02);
            border-color: rgba(34, 211, 238, 0.55);
        }

        .case-gallery-item--hero {
            grid-column: span 2;
        }

        .case-gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .case-gallery-button {
            width: 100%;
            height: 100%;
            cursor: zoom-in;
        }

        .case-detail-scroll {
            min-height: 0;
            overflow-y: auto;
        }

        .case-meta-divider {
            color: rgba(148, 163, 184, 0.45);
        }

        .case-lightbox-image {
            max-width: min(92vw, 1400px);
            max-height: 82vh;
            width: auto;
            height: auto;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
        }

        @media (max-width: 767px) {
            .case-gallery-item--hero {
                grid-column: span 1;
            }

            .case-detail-panel {
                width: 100vw;
                max-height: 100vh;
                border-radius: 0;
                margin: 0;
            }

            .case-lightbox-image {
                max-width: 100vw;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("nexo-theme") || "light");</script>
</head>
<body class="bg-nexo-navy text-white font-sans overflow-x-hidden">

    <!-- Header Placeholder (동적으로 로드됨) -->
    <div id="header-placeholder"></div>

    <!-- Page Content -->
    <section class="pt-32 pb-24 min-h-screen bg-slate-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="text-center mb-16">
                <h2 class="text-nexo-cyan font-bold tracking-widest text-sm mb-2">INSTALLATION CASES</h2>
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-black mb-6 text-white">
                    설치사례
                </h1>
                <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                    다양한 현장에 설치된 NEXO 전자칠판 활용 사례를 확인하세요.
                </p>
            </div>


            <!-- 카테고리별 설치사례 (Supabase 동적 로딩) -->
            <div id="casesSections">
                <p class="text-slate-500 text-center py-12">설치사례 로딩 중...</p>
            </div>

            <!-- 상세 모달 -->
            <div id="caseDetailModal" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/70 backdrop-blur-sm p-0 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="case-title">
                <div class="case-detail-panel relative mx-auto flex overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 shadow-2xl">
                    <div class="flex w-full flex-col">
                        <div class="sticky top-0 z-10 flex justify-end border-b border-slate-700 bg-slate-900 p-4">
                            <button id="caseDetailCloseButton" onclick="closeCaseDetail()" class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-800 p-0 text-slate-400 transition-colors hover:bg-slate-700 hover:text-white" aria-label="설치사례 모달 닫기">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                        <div id="caseDetailContent" class="case-detail-scroll px-6 pb-8 pt-6 sm:px-8"></div>
                    </div>
                </div>
            </div>

            <div id="caseLightbox" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-950/92 p-4">
                <button type="button" onclick="closeCaseLightbox()" class="absolute right-4 top-4 rounded-full bg-white/10 p-3 text-white transition-colors hover:bg-white/20" aria-label="라이트박스 닫기">
                    <i data-lucide="x" class="h-6 w-6"></i>
                </button>
                <button type="button" onclick="navigateCaseLightbox(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 rounded-full bg-white/10 p-3 text-white transition-colors hover:bg-white/20" aria-label="이전 사진">
                    <i data-lucide="chevron-left" class="h-6 w-6"></i>
                </button>
                <div id="caseLightboxViewport" class="flex min-h-full w-full items-center justify-center">
                    <img id="caseLightboxImage" class="case-lightbox-image" alt="설치 사진 크게 보기">
                </div>
                <button type="button" onclick="navigateCaseLightbox(1)" class="absolute right-4 top-1/2 -translate-y-1/2 rounded-full bg-white/10 p-3 text-white transition-colors hover:bg-white/20" aria-label="다음 사진">
                    <i data-lucide="chevron-right" class="h-6 w-6"></i>
                </button>
                <div id="caseLightboxCounter" class="absolute bottom-5 left-1/2 -translate-x-1/2 rounded-full bg-black/45 px-4 py-2 text-sm font-medium text-white"></div>
            </div>

            <script>
                window._caseLightboxState = { caseIndex: -1, imageIndex: 0 };

                window._caseUiState = { activeCaseIndex: -1, trigger: null };

                (async function loadCases() {
                    const SUPABASE_URL = 'https://qwyeanxbtkzompzxndhk.supabase.co';
                    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3eWVhbnhidGt6b21wenhuZGhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NTE5ODcsImV4cCI6MjA4NzEyNzk4N30.qj1dUEokDkvWN_Ukw1nkDqj_aSNwpgTZv7Qti9R5hro';
                    const container = document.getElementById('casesSections');
                    const catOrder = ['학원', '유치원/어린이집', '학교', '기업', '관공서', '기타'];
                    const catIcons = { '학원': 'school', '유치원/어린이집': 'baby', '학교': 'graduation-cap', '기업': 'building-2', '관공서': 'landmark', '기타': 'grid-3x3' };
                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/nexo_cases?is_published=eq.true&order=published_at.desc,created_at.desc`, {
                            headers: { 'apikey': SUPABASE_KEY }
                        });
                        const cases = await res.json();
                        if (!cases || cases.length === 0) {
                            container.innerHTML = '<p class="text-slate-500 text-center py-12">등록된 설치사례가 없습니다.</p>';
                            return;
                        }
                        window._casesData = cases;
                        const grouped = {};
                        cases.forEach(c => {
                            const cat = c.category || '기타';
                            if (!grouped[cat]) grouped[cat] = [];
                            grouped[cat].push(c);
                        });
                        const sortedEntries = Object.entries(grouped).sort((a, b) => {
                            const ia = catOrder.indexOf(a[0]), ib = catOrder.indexOf(b[0]);
                            return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                        });
                        container.innerHTML = sortedEntries.map(([cat, items], idx) => {
                            const icon = catIcons[cat] || 'grid-3x3';
                            const cards = items.map(c => {
                                const gi = cases.indexOf(c);
                                const thumb = c.images && c.images.length > 0
                                    ? `<img src="${c.images[0]}" class="w-full h-full object-cover" alt="${c.title || ''}" loading="lazy">`
                                    : `<div class="w-full h-full flex items-center justify-center bg-slate-700/50"><i data-lucide="image" class="w-10 h-10 text-slate-500"></i></div>`;
                                return `<button type="button" onclick="openCaseDetail(${gi}, this)" class="w-full cursor-pointer rounded-2xl overflow-hidden border border-slate-700 bg-slate-800 text-left transition-all duration-300 hover:-translate-y-1 hover:border-nexo-cyan/50 focus:outline-none focus:ring-2 focus:ring-nexo-cyan/60">
                                    <div class="aspect-[4/3] overflow-hidden">${thumb}</div>
                                    <div class="p-3">
                                        <p class="text-sm text-white font-medium line-clamp-1">${c.title || '설치사례'}</p>
                                        ${c.location ? `<p class="text-xs text-slate-400 mt-1">${c.location}</p>` : ''}
                                    </div>
                                </button>`;
                            }).join('');
                            return `<div class="mb-12 ${idx > 0 ? 'pt-8 border-t border-slate-700' : ''}">
                                <h3 class="text-2xl font-bold text-white mb-8 flex items-center gap-3">
                                    <i data-lucide="${icon}" class="w-6 h-6 text-nexo-cyan"></i>
                                    ${cat}
                                </h3>
                                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 sm:gap-6">${cards}</div>
                            </div>`;
                        }).join('');
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    } catch (e) {
                        container.innerHTML = '<p class="text-red-400 text-center py-12">설치사례 로딩 실패</p>';
                    }
                })();

                function escapeHtml(value) {
                    return (value || '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;');
                }

                function formatCaseDate(dateValue) {
                    if (!dateValue) return '';
                    const parsed = new Date(dateValue);
                    if (Number.isNaN(parsed.getTime())) return escapeHtml(dateValue);
                    return new Intl.DateTimeFormat('ko-KR', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }).format(parsed);
                }

                function sanitizeCaseHtml(html) {
                    if (typeof DOMPurify === 'undefined') return html || '';
                    return DOMPurify.sanitize(html || '', {
                        ALLOWED_TAGS: ['h3', 'h4', 'p', 'img', 'figure', 'figcaption', 'strong', 'em', 'ul', 'li', 'blockquote', 'hr', 'div'],
                        ALLOWED_ATTR: ['src', 'alt', 'class'],
                    });
                }

                function trapFocusInCaseModal(event) {
                    if (event.key !== 'Tab') return;
                    const modal = document.getElementById('caseDetailModal');
                    if (!modal || modal.classList.contains('hidden')) return;

                    const focusable = [...modal.querySelectorAll('button, a, [tabindex]:not([tabindex="-1"])')]
                        .filter((element) => !element.hasAttribute('disabled'));
                    if (!focusable.length) return;

                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];

                    if (event.shiftKey && document.activeElement === first) {
                        event.preventDefault();
                        last.focus();
                    } else if (!event.shiftKey && document.activeElement === last) {
                        event.preventDefault();
                        first.focus();
                    }
                }

                function openCaseDetail(idx, trigger = null) {
                    const c = window._casesData[idx];
                    if (!c) return;
                    const modal = document.getElementById('caseDetailModal');
                    const content = document.getElementById('caseDetailContent');
                    const formattedDate = formatCaseDate(c.installation_date);
                    const gallery = c.images && c.images.length > 0
                        ? `<div class="mt-8">
                            <h3 class="text-lg font-bold text-white mb-4">설치 사진</h3>
                            <div class="case-gallery-grid">
                                ${c.images.map((img, imageIndex) => `
                                    <button type="button" onclick="openCaseLightbox(${idx}, ${imageIndex})" class="case-gallery-button ${imageIndex === 0 ? 'case-gallery-item case-gallery-item--hero' : 'case-gallery-item'}" aria-label="설치 사진 ${imageIndex + 1} 보기">
                                        <img src="${img}" alt="설치사진 ${imageIndex + 1}" loading="lazy">
                                    </button>
                                `).join('')}
                            </div>
                        </div>`
                        : '';
                    const metaItems = [
                        c.location ? `<span class="inline-flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-nexo-cyan shrink-0"></i><span>${escapeHtml(c.location)}</span></span>` : '',
                        formattedDate ? `<span class="inline-flex items-center gap-2"><i data-lucide="calendar-days" class="w-4 h-4 text-nexo-cyan shrink-0"></i><span>${formattedDate}</span></span>` : '',
                        c.equipment_model ? `<span class="inline-flex items-center gap-2"><i data-lucide="monitor-smartphone" class="w-4 h-4 text-nexo-cyan shrink-0"></i><span>${escapeHtml(c.equipment_model)}</span></span>` : '',
                        c.installation_size ? `<span class="inline-flex items-center gap-2"><i data-lucide="ruler" class="w-4 h-4 text-nexo-cyan shrink-0"></i><span>${escapeHtml(c.installation_size)}</span></span>` : '',
                    ].filter(Boolean).join('<span class="case-meta-divider">·</span>');
                    content.innerHTML = `
                        <div class="mb-6">
                            <span class="inline-flex items-center rounded-full bg-nexo-cyan/15 px-3 py-1 text-xs font-bold text-nexo-cyan">${escapeHtml(c.category || '설치사례')}</span>
                            <h2 id="case-title" class="mt-3 text-2xl font-black text-white sm:text-3xl">${escapeHtml(c.title || '설치사례')}</h2>
                            ${metaItems ? `<div class="mt-4 flex flex-wrap items-center gap-3 text-sm text-slate-300">${metaItems}</div>` : ''}
                        </div>
                        ${c.description ? `<p class="mb-6 text-base leading-7 text-slate-300">${escapeHtml(c.description)}</p>` : ''}
                        ${c.content ? `<div class="case-content">${sanitizeCaseHtml(c.content)}</div>` : ''}
                        ${gallery}
                        <div class="mt-8 flex flex-col gap-3 border-t border-slate-700 pt-6 sm:flex-row">
                            <a href="contact.html" class="inline-flex items-center justify-center gap-2 rounded-full bg-nexo-cyan px-5 py-3 text-sm font-bold text-nexo-navy transition-colors hover:bg-white">
                                무료 견적 문의
                                <i data-lucide="phone-call" class="h-4 w-4"></i>
                            </a>
                            <button type="button" onclick="closeCaseDetail()" class="inline-flex items-center justify-center gap-2 rounded-full border border-slate-600 bg-slate-800 px-5 py-3 text-sm font-bold text-white transition-colors hover:bg-slate-700">
                                목록으로 돌아가기
                                <i data-lucide="arrow-left" class="h-4 w-4"></i>
                            </button>
                        </div>
                    `;
                    window._caseUiState.activeCaseIndex = idx;
                    window._caseUiState.trigger = trigger || document.activeElement;
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                    document.body.style.overflow = 'hidden';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    const closeButton = document.getElementById('caseDetailCloseButton');
                    closeButton?.focus();
                }

                function closeCaseDetail() {
                    const modal = document.getElementById('caseDetailModal');
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    document.body.style.overflow = '';
                    window._caseUiState.trigger?.focus?.();
                }

                function openCaseLightbox(caseIndex, imageIndex) {
                    const currentCase = window._casesData?.[caseIndex];
                    if (!currentCase || !Array.isArray(currentCase.images) || !currentCase.images.length) return;

                    window._caseLightboxState = { caseIndex, imageIndex };
                    const lightbox = document.getElementById('caseLightbox');
                    lightbox.classList.remove('hidden');
                    lightbox.classList.add('flex');
                    renderCaseLightbox();
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }

                function renderCaseLightbox() {
                    const { caseIndex, imageIndex } = window._caseLightboxState || {};
                    const currentCase = window._casesData?.[caseIndex];
                    if (!currentCase || !Array.isArray(currentCase.images) || !currentCase.images.length) return;

                    const normalizedIndex = ((imageIndex % currentCase.images.length) + currentCase.images.length) % currentCase.images.length;
                    window._caseLightboxState.imageIndex = normalizedIndex;

                    const imageEl = document.getElementById('caseLightboxImage');
                    const counterEl = document.getElementById('caseLightboxCounter');
                    imageEl.src = currentCase.images[normalizedIndex];
                    imageEl.alt = `${currentCase.title || '설치사례'} 사진 ${normalizedIndex + 1}`;
                    counterEl.textContent = `${normalizedIndex + 1} / ${currentCase.images.length}`;
                }

                function navigateCaseLightbox(direction) {
                    if (!window._caseLightboxState) return;
                    window._caseLightboxState.imageIndex += direction;
                    renderCaseLightbox();
                }

                function closeCaseLightbox() {
                    const lightbox = document.getElementById('caseLightbox');
                    const imageEl = document.getElementById('caseLightboxImage');
                    lightbox.classList.add('hidden');
                    lightbox.classList.remove('flex');
                    imageEl.removeAttribute('src');
                }

                document.addEventListener('keydown', (event) => {
                    const detailModal = document.getElementById('caseDetailModal');
                    if (detailModal && !detailModal.classList.contains('hidden')) {
                        if (event.key === 'Escape') {
                            closeCaseDetail();
                            return;
                        }
                        trapFocusInCaseModal(event);
                    }

                    const lightbox = document.getElementById('caseLightbox');
                    if (lightbox && !lightbox.classList.contains('hidden')) {
                        if (event.key === 'Escape') {
                            closeCaseLightbox();
                            return;
                        }
                        if (event.key === 'ArrowLeft') {
                            navigateCaseLightbox(-1);
                            return;
                        }
                        if (event.key === 'ArrowRight') {
                            navigateCaseLightbox(1);
                            return;
                        }
                    }
                });

                (function setupCaseLightboxSwipe() {
                    const viewport = document.getElementById('caseLightboxViewport');
                    if (!viewport) return;

                    let touchStartX = 0;
                    let touchEndX = 0;

                    viewport.addEventListener('touchstart', (event) => {
                        touchStartX = event.changedTouches[0]?.clientX || 0;
                    }, { passive: true });

                    viewport.addEventListener('touchend', (event) => {
                        touchEndX = event.changedTouches[0]?.clientX || 0;
                        const delta = touchEndX - touchStartX;
                        if (Math.abs(delta) < 40) return;
                        navigateCaseLightbox(delta > 0 ? -1 : 1);
                    }, { passive: true });
                })();

                document.getElementById('caseLightbox')?.addEventListener('click', (event) => {
                    if (event.target.id === 'caseLightbox' || event.target.id === 'caseLightboxViewport') {
                        closeCaseLightbox();
                    }
                });

                document.getElementById('caseDetailModal')?.addEventListener('click', (event) => {
                    if (event.target.id === 'caseDetailModal') {
                        closeCaseDetail();
                    }
                });
            </script>
        </div>
    </section>

    <div id="nav-cards-placeholder"></div>
    <div id="footer-placeholder"></div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="components/parse-field-news.js"></script>
    <script src="components/admin.js"></script>
    <div id="admin-placeholder"></div>
</body>
</html>
