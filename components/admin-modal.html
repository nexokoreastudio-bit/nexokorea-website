<!-- Admin Login Modal -->
<div id="adminLoginModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm">
    <div class="relative w-full max-w-md mx-4 bg-slate-900 rounded-2xl border border-slate-700 shadow-2xl">
        <button onclick="closeModal('adminLoginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors z-10">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <div class="p-6 sm:p-8">
            <h2 class="text-2xl font-bold text-white mb-6">관리자 로그인</h2>
            <!-- Google OAuth -->
            <button onclick="adminGoogleLogin()" class="w-full px-6 py-3 bg-white text-slate-800 font-bold rounded-lg hover:bg-slate-100 transition-all flex items-center justify-center gap-3 mb-4">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Google 로그인
            </button>
            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
                <div class="relative flex justify-center text-xs"><span class="px-2 bg-slate-900 text-slate-500">또는 이메일 로그인</span></div>
            </div>
            <form id="adminLoginForm" class="space-y-4" onsubmit="return false;">
                <div>
                    <label for="adminEmail" class="block text-sm font-medium text-slate-300 mb-2">이메일</label>
                    <input type="email" id="adminEmail" required
                           class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-nexo-cyan focus:ring-2 focus:ring-nexo-cyan/20 transition-colors"
                           placeholder="관리자 이메일">
                </div>
                <div>
                    <label for="adminPassword" class="block text-sm font-medium text-slate-300 mb-2">비밀번호</label>
                    <input type="password" id="adminPassword" required
                           class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-nexo-cyan focus:ring-2 focus:ring-nexo-cyan/20 transition-colors"
                           placeholder="비밀번호">
                </div>
                <div id="loginError" class="text-red-400 text-sm hidden"></div>
                <button type="button" id="loginBtn" onclick="handleEmailLogin()" class="w-full px-6 py-3 bg-nexo-cyan text-nexo-navy font-bold rounded-lg hover:bg-white transition-all">
                    로그인
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Admin Panel Modal (6 Tabs) -->

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">카테고리 *</label>
                                <select name="category" required class="admin-input">
                                    <option value="필수 유틸리티">필수 유틸리티</option>
                                    <option value="문서 뷰어">문서 뷰어</option>
                                    <option value="교육 멀티미디어">교육 멀티미디어</option>

                                    <option value="시스템 펌웨어">시스템 펌웨어</option>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">설명</label>
                            <textarea name="description" rows="2" class="admin-input resize-none" placeholder="자료 설명"></textarea>
                        </div>
                        <button type="submit" class="admin-btn-primary">자료 추가</button>
                    </form>
                </div>
                <h3 class="text-lg font-bold text-white mb-4">등록된 기술자료</h3>

            <!-- Manuals Tab -->
            <div id="tab-manuals" class="admin-tab-content hidden">

                            <input type="text" name="title" required class="admin-input" placeholder="매뉴얼 제목">

                            <label class="block text-sm font-medium text-slate-300 mb-2">PDF URL *</label>
                            <input type="url" name="pdf_url" required class="admin-input" placeholder="https://...">

                            <label class="block text-sm font-medium text-slate-300 mb-2">제목</label>

                            <button type="submit" name="action" value="publish" class="flex-1 admin-btn-primary">발행</button>

                    </form>

        </div>
    </div>
</div>
