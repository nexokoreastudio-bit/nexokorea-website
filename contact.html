    <script>
        // Initialize Lucide Icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // Form Submission Handler
        async function handleFormSubmit(event) {
            return submitQuoteForm(event, {
                onSuccess: openSuccessModal
            });
        }

        function openSuccessModal() {
            const modal = document.getElementById('successModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = '';
            }
        }

        // Manual Search Functionality (for manual.html, but included here for consistency)
        const manualSearch = document.getElementById('manualSearch');
        if (manualSearch) {
            manualSearch.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const items = document.querySelectorAll('.manual-item');
                
                items.forEach(item => {
                    const keywords = item.getAttribute('data-keywords').toLowerCase();
                    if (keywords.includes(searchTerm) || searchTerm === '') {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }

        // FAQ Accordion Logic
        function initFAQ() {
            const faqContainers = document.querySelectorAll('.border.border-slate-800.rounded-xl.bg-slate-900');
            
            faqContainers.forEach(container => {
                const btn = container.querySelector('.faq-btn');
                const content = container.querySelector('.faq-content');
                const icon = btn ? btn.querySelector('i') : null;
                
                if (btn && content) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        const isHidden = content.classList.contains('hidden');
                        
                        faqContainers.forEach(otherContainer => {
                            if (otherContainer !== container) {
                                const otherContent = otherContainer.querySelector('.faq-content');
                                const otherBtn = otherContainer.querySelector('.faq-btn');
                                const otherIcon = otherBtn ? otherBtn.querySelector('i') : null;
                                
                                if (otherContent) {
                                    otherContent.classList.add('hidden');
                                }
                                if (otherIcon) {
                                    otherIcon.style.transform = 'rotate(0deg)';
                                }
                                if (otherBtn) {
                                    otherBtn.classList.remove('text-nexo-cyan');
                                }
                            }
                        });
                        
                        if (isHidden) {
                            content.classList.remove('hidden');
                            if (icon) icon.style.transform = 'rotate(180deg)';
                            btn.classList.add('text-nexo-cyan');
                        } else {
                            content.classList.add('hidden');
                            if (icon) icon.style.transform = 'rotate(0deg)';
                            btn.classList.remove('text-nexo-cyan');
                        }
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initFAQ();
        });
    </script>
