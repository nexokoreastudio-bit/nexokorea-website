<body class="bg-nexo-navy text-white font-sans overflow-x-hidden">
    <div id="header-placeholder"></div>

    <main>
        <section class="blog-cafe-section min-h-screen pt-32 pb-20">
            <div class="max-w-6xl mx-auto px-4 sm:px-6">
                <div class="text-center mb-12 sm:mb-16">

                    <h1 class="blog-cafe-title text-4xl sm:text-5xl md:text-6xl font-black mb-6">블로그 / 카페</h1>
                    <p class="blog-cafe-description text-base sm:text-lg max-w-2xl mx-auto leading-8">
                        설치 후기, 제품 활용 팁, 현장 이야기와 커뮤니티 소식을 외부 채널에서 더 자세히 확인하세요.
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
                    <a
                        href="https://blog.naver.com/nexokorea"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="blog-cafe-card blog-cafe-card--blog group rounded-3xl p-7 sm:p-10 transition-all duration-300 hover:-translate-y-1"
                    >
                        <div class="flex items-center justify-between gap-4 mb-10">
                            <div class="blog-cafe-icon blog-cafe-icon--blog w-16 h-16 rounded-2xl flex items-center justify-center">
                                <i data-lucide="pen-square" class="w-8 h-8"></i>
                            </div>
                            <span class="blog-cafe-label blog-cafe-label--blog text-xs font-bold tracking-[0.25em]">NAVER BLOG</span>
                        </div>
                        <h2 class="blog-cafe-card-title text-3xl font-black mb-4 transition-colors">네이버 블로그</h2>
                        <p class="blog-cafe-card-text leading-8 text-sm sm:text-base">
                            전자칠판 설치 사례, 제품 리뷰, 수업·회의 활용 팁처럼 조금 더 자세한 읽을거리를 정리합니다.
                        </p>
                        <div class="blog-cafe-cta blog-cafe-cta--blog mt-10 inline-flex items-center gap-2 font-bold group-hover:gap-3 transition-all">
                            블로그 방문하기
                            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
                        </div>
                    </a>

                    <a
                        href="https://cafe.naver.com/greenlv3dr"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="blog-cafe-card blog-cafe-card--cafe group rounded-3xl p-7 sm:p-10 transition-all duration-300 hover:-translate-y-1"
                    >
                        <div class="flex items-center justify-between gap-4 mb-10">
                            <div class="blog-cafe-icon blog-cafe-icon--cafe w-16 h-16 rounded-2xl flex items-center justify-center">
                                <i data-lucide="messages-square" class="w-8 h-8"></i>
                            </div>
                            <span class="blog-cafe-label blog-cafe-label--cafe text-xs font-bold tracking-[0.25em]">NAVER CAFE</span>
