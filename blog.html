<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>블로그·뉴스 | 전자칠판 소식 - NEXO KOREA</title>
    <meta name="description" content="NEXO KOREA 블로그. 전자칠판 업계 소식, 교육 트렌드, 제품 활용 팁, 설치 사례 이야기.">
    <link rel="canonical" href="https://nexokorea.co.kr/blog.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="블로그·뉴스 - NEXO KOREA">
    <meta property="og:description" content="전자칠판 업계 소식, 교육 트렌드, 제품 활용 팁.">
    <meta property="og:url" content="https://nexokorea.co.kr/blog.html">
    <meta property="og:site_name" content="NEXO KOREA">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="블로그·뉴스 - NEXO KOREA">
    <meta name="twitter:description" content="전자칠판 업계 소식, 교육 트렌드, 활용 팁.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 폰트: Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- 아이콘: Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 공통 컴포넌트 로드 스크립트 -->
    <script src="components/components.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nexo: {
                            navy: '#0f172a',
                            dark: '#020617',
                            cyan: '#06b6d4',
                            accent: '#22d3ee',
                            orange: '#f97316',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("nexo-theme") || "light");</script>
</head>
<body class="bg-nexo-navy text-white font-sans overflow-x-hidden">

    <!-- Header Placeholder (동적으로 로드됨) -->
    <div id="header-placeholder"></div>

    <!-- Page Content -->
    <section class="pt-32 pb-24 min-h-screen bg-slate-900">
        <div class="max-w-4xl mx-auto px-4 sm:px-6">
            <div class="text-center mb-16">
                <h2 class="text-nexo-cyan font-bold tracking-widest text-sm mb-2">BLOG & CAFE</h2>
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-black mb-6 text-white">
                    블로그 / 카페
                </h1>
                <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                    NEXO KOREA의 블로그와 카페에서 더 많은 소식을 확인하세요.
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                <!-- 네이버 블로그 -->
                <a href="https://blog.naver.com/nexokorea" target="_blank" rel="noopener noreferrer" class="group bg-slate-800 rounded-2xl p-8 sm:p-10 border border-slate-700 hover:border-green-400/50 transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl flex flex-col items-center text-center">
                    <div class="w-20 h-20 bg-green-500/20 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-green-500/30 transition-colors">
                        <i data-lucide="pen-square" class="w-10 h-10 text-green-400"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-3 group-hover:text-green-400 transition-colors">네이버 블로그</h3>
                    <p class="text-slate-400 mb-6">제품 리뷰, 설치 사례, 활용 팁 등<br>다양한 콘텐츠를 확인하세요.</p>
                    <span class="inline-flex items-center gap-2 text-green-400 font-bold group-hover:gap-3 transition-all">
                        블로그 방문하기
                        <i data-lucide="external-link" class="w-5 h-5"></i>
                    </span>
                </a>

                <!-- 네이버 카페 -->
                <a href="https://cafe.naver.com/greenlv3dr" target="_blank" rel="noopener noreferrer" class="group bg-slate-800 rounded-2xl p-8 sm:p-10 border border-slate-700 hover:border-nexo-cyan/50 transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl flex flex-col items-center text-center">
                    <div class="w-20 h-20 bg-nexo-cyan/20 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-nexo-cyan/30 transition-colors">
                        <i data-lucide="users" class="w-10 h-10 text-nexo-cyan"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-3 group-hover:text-nexo-cyan transition-colors">네이버 카페</h3>
                    <p class="text-slate-400 mb-6">사용자 커뮤니티에서 정보를 공유하고<br>궁금한 점을 질문하세요.</p>
                    <span class="inline-flex items-center gap-2 text-nexo-cyan font-bold group-hover:gap-3 transition-all">
                        카페 방문하기
                        <i data-lucide="external-link" class="w-5 h-5"></i>
                    </span>
                </a>
            </div>

            <div class="text-center mt-12">
                <p class="text-slate-500 text-sm">최신 소식과 커뮤니티를 확인해보세요.</p>
            </div>
        </div>
    </section>

    <div id="nav-cards-placeholder"></div>

    <!-- Footer Placeholder (동적으로 로드됨) -->
    <div id="footer-placeholder"></div>

    <script>
        // Initialize Lucide Icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
