<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>사용매뉴얼 - NEXO KOREA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트: Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- 아이콘: Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 공통 컴포넌트 로드 스크립트 -->
    <script src="components/components.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nexo: {
                            navy: '#0f172a',
                            dark: '#020617',
                            cyan: '#06b6d4',
                            accent: '#22d3ee',
                            orange: '#f97316',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
        
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-nexo-navy text-white font-sans overflow-x-hidden">

    <!-- Header Placeholder (동적으로 로드됨) -->
    <div id="header-placeholder"></div>

    <!-- Page Content -->
    <section class="pt-32 pb-24 min-h-screen">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="text-center mb-16">
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-black mb-6">
                    사용매뉴얼
                </h1>
                <p class="text-lg text-slate-400">
                    준비 중입니다. 곧 업데이트될 예정입니다.
                </p>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder (동적으로 로드됨) -->
    <div id="footer-placeholder"></div>

    <script>
        // Initialize Lucide Icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
