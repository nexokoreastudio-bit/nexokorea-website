                    <section>
                        <h3 class="text-2xl font-bold text-white mb-2 flex items-center gap-3">
                            <i data-lucide="${category.icon}" class="w-6 h-6 text-nexo-cyan"></i>
                            ${categoryIndex + 1}. ${escapeResourcesHtml(category.name)}
                        </h3>
                        <p class="text-slate-400 mb-6">${escapeResourcesHtml(category.description)}</p>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 lg:gap-6">
                            ${cards}
                        </div>
                    </section>
                `;
            }).join('');

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function buildDocKey(item) {
            return [item.category || '', item.title || '', item.version || ''].join('::').toLowerCase();
        }

        function mergeTechDocs(defaultDocs, remoteDocs) {
            const merged = new Map();
            defaultDocs.forEach(item => {
                merged.set(buildDocKey(item), item);
            });
            remoteDocs.forEach(item => {
                merged.set(buildDocKey(item), item);
            });
            return Array.from(merged.values());
        }

        async function loadTechDocs() {
            const container = document.getElementById('techDocsSections');
            try {
                const res = await fetch(`${RESOURCES_SUPABASE_URL}/rest/v1/nexo_tech_docs?select=id,title,download_url,category,version,description,sort_order&or=(is_published.is.null,is_published.eq.true)&order=sort_order.asc,created_at.desc`, {
                    headers: { apikey: RESOURCES_SUPABASE_KEY }
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const docs = await res.json();
                renderTechDocSections(mergeTechDocs(DEFAULT_TECH_DOCS, Array.isArray(docs) ? docs : []));
            } catch (error) {
                console.error('[resources] failed to load tech docs', error);
                renderTechDocSections(DEFAULT_TECH_DOCS);
            }
        }

        loadTechDocs();
    </script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="components/parse-field-news.js"></script>
    <script src="components/admin.js"></script>
    <div id="admin-placeholder"></div>
    <script>
        async function ensureAdminUiReady() {
            if (!document.getElementById('adminLoginModal')) {
                if (typeof loadAdminModal === 'function') {
                    await loadAdminModal();
                } else {
                    const res = await fetch('components/admin-modal.html');
                    if (!res.ok) throw new Error('admin modal load failed');
                    const html = await res.text();
                    const placeholder = document.getElementById('admin-placeholder');
                    if (placeholder) {
                        placeholder.innerHTML = html;
                        if (typeof lucide !== 'undefined') {
                            lucide.createIcons();
                        }
                        if (typeof initAdmin === 'function') {
                            await initAdmin();
                        }
                    }
                }
            }

            wireAdminModalActions();

            const emailInput = document.getElementById('adminEmail');
            if (emailInput) {
                emailInput.value = 'admin@nexokorea.co.kr';
            }

            if (typeof openAdminLogin === 'function') {
                openAdminLogin();
            } else {
                const loginModal = document.getElementById('adminLoginModal');
                if (loginModal) {
                    loginModal.classList.remove('hidden');
                    loginModal.classList.add('flex');
                    document.body.style.overflow = 'hidden';
                }
            }
        }

        function forceCloseModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        function wireAdminModalActions() {
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn && loginBtn.dataset.boundManualAdmin !== 'true') {
                loginBtn.dataset.boundManualAdmin = 'true';
                loginBtn.onclick = null;
                loginBtn.addEventListener('click', async (event) => {
                    event.preventDefault();
                    if (typeof initAdmin === 'function') {
                        await initAdmin();
                    }
                    if (typeof handleEmailLogin === 'function') {
                        await handleEmailLogin();
                    }
                });
            }

            document.querySelectorAll('#adminLoginModal [data-admin-close], #adminPanelModal [data-admin-close]').forEach((button) => {
                if (button.dataset.boundManualAdmin === 'true') return;
                button.dataset.boundManualAdmin = 'true';
                button.onclick = null;
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    const targetId = button.getAttribute('data-admin-close');
                    if (typeof closeModal === 'function') {
                        closeModal(targetId);
                    } else {
                        forceCloseModal(targetId);
                    }
                });
            });
        }

        function bindAdminButton(button) {
            if (!button || button.dataset.boundAdminOpen === 'true') return;
            button.dataset.boundAdminOpen = 'true';
            button.onclick = null;
            button.addEventListener('click', async (event) => {
                event.preventDefault();
                event.stopPropagation();
                await ensureAdminUiReady();
            });
        }

        window.addEventListener('load', () => {
            window.setTimeout(async () => {
                const existingButton = document.getElementById('adminButton');
                if (existingButton) {
                    bindAdminButton(existingButton);
                    return;
                }

                const button = document.createElement('button');
                button.id = 'adminButtonFallback';
                button.type = 'button';
                button.className = 'fixed bottom-6 right-6 z-[80] w-12 h-12 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-full shadow-lg flex items-center justify-center transition-all border border-slate-700';
                button.setAttribute('aria-label', '관리자 로그인 열기');
                button.innerHTML = '<i data-lucide="settings" class="w-5 h-5"></i>';
                document.body.appendChild(button);
                bindAdminButton(button);
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, 500);
        }, { once: true });
    </script>
</body>
</html>
