<body class="bg-nexo-navy text-white font-sans overflow-x-hidden">

    <!-- Page Content -->

    <div id="nav-cards-placeholder"></div>

    <!-- Footer Placeholder (동적으로 로드됨) -->
    <div id="footer-placeholder"></div>

    <script>
        const TECH_DOC_CATEGORIES = [
            {
                name: '펌웨어 및 업그레이드',
                icon: 'cpu',
                description: '시스템 업데이트, 펌웨어 패치, 기본 시스템 앱을 한 곳에서 내려받을 수 있습니다.'
            },
            {
                name: '전자칠판용 앱',
                icon: 'tablet-smartphone',
                description: '전자칠판에서 자주 쓰는 앱과 문서 뷰어를 빠르게 설치할 수 있도록 정리했습니다.'
            },
            {
                name: '윈도우용 프로그램',
                icon: 'monitor',
                description: 'PC 연결, 문서 실행, 보조 도구처럼 윈도우 환경에서 필요한 프로그램을 제공합니다.'
            },
            {
                name: '교육 및 멀티미디어 앱',
                icon: 'graduation-cap',
                description: '수업, 콘텐츠 재생, 교육용 활용에 맞춘 멀티미디어 앱을 모아두었습니다.'
            },
            {
                name: '미러링 및 원격제어',
                icon: 'cast',
                description: '무선 공유, 미러링, 원격 지원에 필요한 도구를 바로 내려받을 수 있습니다.'
            }
        ];

        const CATEGORY_CARD_ICONS = {
            '펌웨어 및 업그레이드': 'wrench',
            '전자칠판용 앱': 'package',
            '윈도우용 프로그램': 'monitor',
            '교육 및 멀티미디어 앱': 'graduation-cap',
            '미러링 및 원격제어': 'cast'
        };

        const SUPABASE_URL = 'https://qwyeanxbtkzompzxndhk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3eWVhbnhidGt6b21wenhuZGhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NTE5ODcsImV4cCI6MjA4NzEyNzk4N30.qj1dUEokDkvWN_Ukw1nkDqj_aSNwpgTZv7Qti9R5hro';

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getTechDocTitle(item) {
            const title = item.title || '기술자료';
            if (!item.version) return title;
            return title.includes(item.version) ? title : `${title} (${item.version})`;
        }

        function renderTechDocCard(item, itemIndex) {
            const icon = CATEGORY_CARD_ICONS[item.category] || 'file-text';
            const description = item.description || '다운로드 설명이 준비 중입니다.';
            const downloadUrl = item.download_url || '';
            const hasDownload = Boolean(downloadUrl);

            return `
                <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 hover:border-nexo-cyan/50 transition-all duration-300 hover:-translate-y-2 relative">
                    <div class="absolute top-4 right-4 w-8 h-8 bg-nexo-cyan text-nexo-navy rounded-full flex items-center justify-center text-sm font-bold">${itemIndex + 1}</div>
                    <div class="w-16 h-16 bg-nexo-cyan/20 rounded-xl flex items-center justify-center mb-4">
                        <i data-lucide="${icon}" class="w-8 h-8 text-nexo-cyan"></i>
                    </div>
                    <h4 class="text-lg font-bold text-white mb-2">${escapeHtml(getTechDocTitle(item))}</h4>
                    <p class="text-slate-400 text-sm mb-4">${escapeHtml(description)}</p>
                    ${hasDownload
                        ? `<a href="${escapeHtml(downloadUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-nexo-cyan hover:text-white transition-colors">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                다운로드
                           </a>`
                        : `<span class="inline-flex items-center gap-2 text-slate-500 text-sm">
                                <i data-lucide="clock-3" class="w-4 h-4"></i>
                                링크 준비 중
                           </span>`}
                </div>
            `;
        }

        function renderEmptyCategoryCard(categoryName) {
            const icon = CATEGORY_CARD_ICONS[categoryName] || 'file-text';
            return `
                <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 relative">
                    <div class="w-16 h-16 bg-nexo-cyan/20 rounded-xl flex items-center justify-center mb-4">
                        <i data-lucide="${icon}" class="w-8 h-8 text-nexo-cyan"></i>
                    </div>
                    <h4 class="text-lg font-bold text-white mb-2">${escapeHtml(categoryName)}</h4>
                    <p class="text-slate-400 text-sm mb-4">자료 준비 중입니다</p>
                    <span class="text-slate-500 text-sm">Coming Soon</span>
                </div>
            `;
        }

        function renderTechDocSections(items) {
            const container = document.getElementById('techDocsSections');
            const grouped = new Map(TECH_DOC_CATEGORIES.map(category => [category.name, []]));

            items.forEach(item => {
                const categoryName = TECH_DOC_CATEGORIES.some(category => category.name === item.category)
                    ? item.category
                    : TECH_DOC_CATEGORIES[TECH_DOC_CATEGORIES.length - 1].name;
                grouped.get(categoryName).push(item);
            });

            container.innerHTML = TECH_DOC_CATEGORIES.map((category, categoryIndex) => {
                const docs = grouped.get(category.name) || [];
                const cards = docs.length
                    ? docs.map((item, itemIndex) => renderTechDocCard(item, itemIndex)).join('')
                    : renderEmptyCategoryCard(category.name);

                return `
                    <section>
                        <h3 class="text-2xl font-bold text-white mb-2 flex items-center gap-3">
                            <i data-lucide="${category.icon}" class="w-6 h-6 text-nexo-cyan"></i>
                            ${categoryIndex + 1}. ${escapeHtml(category.name)}
                        </h3>
                        <p class="text-slate-400 mb-6">${escapeHtml(category.description)}</p>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 lg:gap-6">
                            ${cards}
                        </div>
                    </section>
                `;
            }).join('');

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        async function loadTechDocs() {
            const container = document.getElementById('techDocsSections');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/nexo_tech_docs?select=id,title,download_url,category,version,description,sort_order&is_published=eq.true&order=sort_order.asc,created_at.desc`, {
                    headers: { apikey: SUPABASE_KEY }
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const docs = await res.json();
                renderTechDocSections(Array.isArray(docs) ? docs : []);
            } catch (error) {
                console.error('[resources] failed to load tech docs', error);
                container.innerHTML = `
                    <div class="rounded-2xl border border-red-500/30 bg-red-500/10 px-6 py-8 text-center">
                        <p class="text-lg font-bold text-white mb-2">기술자료를 불러오지 못했습니다.</p>
                        <p class="text-slate-300">잠시 후 다시 시도해 주세요.</p>
                    </div>
                `;
            }
        }

        loadTechDocs();
    </script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
